<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Image Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/style.css">
    <style>
        body { padding: 20px; }
        .test-section { margin-bottom: 30px; border: 1px solid #ddd; padding: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mobile Image Responsiveness Test</h1>
        
        <div class="test-section">
            <h3>Desktop View (206x116px)</h3>
            <div class="level-thumbnail-container">
                <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" 
                     alt="Test Video" 
                     class="level-thumbnail img-fluid rounded">
                <div class="position-absolute top-0 start-0 bg-dark text-white px-2 py-1 rounded">
                    #1
                </div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>Mobile View (Responsive)</h3>
            <div style="max-width: 320px;">
                <div class="level-thumbnail-container">
                    <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" 
                         alt="Test Video" 
                         class="level-thumbnail img-fluid rounded">
                    <div class="position-absolute top-0 start-0 bg-dark text-white px-2 py-1 rounded">
                        #1
                    </div>
                </div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>Placeholder Test</h3>
            <div class="level-thumbnail-container">
                <div class="level-thumbnail-placeholder bg-light rounded d-flex align-items-center justify-content-center text-muted">
                    <div class="text-center">
                        <i class="fas fa-image fa-2x mb-2"></i>
                        <div>No Preview</div>
                    </div>
                </div>
                <div class="position-absolute top-0 start-0 bg-dark text-white px-2 py-1 rounded">
                    #2
                </div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>Level Card Test</h3>
            <div class="level-card d-flex align-items-center p-3 border-bottom">
                <div class="me-4">
                    <div class="position-relative">
                        <div class="level-thumbnail-container">
                            <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" 
                                 alt="Test Level" 
                                 class="level-thumbnail img-fluid rounded">
                        </div>
                        <div class="position-absolute top-0 start-0 bg-dark text-white px-2 py-1 rounded">
                            #1
                        </div>
                    </div>
                </div>
                <div class="flex-grow-1">
                    <h5 class="mb-1">Test Level Name</h5>
                    <p class="mb-1 text-muted">by Test Creator</p>
                    <small class="text-muted d-block">verified by Test Verifier</small>
                </div>
                <div class="text-end">
                    <div class="text-muted"><strong>Extreme Demon</strong></div>
                    <small class="text-muted">100 points</small>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Test responsive behavior
        function testResize() {
            const containers = document.querySelectorAll('.level-thumbnail-container');
            containers.forEach(container => {
                console.log('Container dimensions:', container.offsetWidth, 'x', container.offsetHeight);
            });
        }
        
        window.addEventListener('resize', testResize);
        testResize();
    </script>
</body>
</html>
